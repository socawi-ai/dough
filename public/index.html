<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#cc6b2c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1712" media="(prefers-color-scheme: dark)" />
    <title>Degkalkylator</title>
    <style>
      :root {
        --bg: #f4f1ea;
        --panel: #fffaf0;
        --panel-alt: #fffaf4;
        --input-bg: #ffffff;
        --ink: #2f231a;
        --muted: #6e5d50;
        --accent: #cc6b2c;
        --line: #e9dcc8;
        --ok: #236b3e;
        --err: #9b1c1c;
        --chip-bg: #ffe8d7;
        --chip-ink: #8a3f11;
        --chip-border: #f0c8a8;
        --danger-bg: #fce8e8;
        --danger-ink: #8f1d1d;
        --danger-border: #efc4c4;
        --shadow: rgba(47, 35, 26, 0.1);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1712;
          --panel: #24201a;
          --panel-alt: #2c2620;
          --input-bg: #2c2620;
          --ink: #f2e9da;
          --muted: #b7a68d;
          --accent: #e79256;
          --line: #443a2c;
          --ok: #6fd39a;
          --err: #ff9d9d;
          --chip-bg: #4a2f1c;
          --chip-ink: #ffcf9e;
          --chip-border: #6b4526;
          --danger-bg: #4a2323;
          --danger-ink: #ffb3b3;
          --danger-border: #6b3232;
          --shadow: rgba(0, 0, 0, 0.4);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 10%, color-mix(in srgb, var(--panel) 60%, transparent) 0, transparent 40%),
          radial-gradient(circle at 90% 90%, color-mix(in srgb, var(--accent) 12%, transparent) 0, transparent 35%),
          var(--bg);
      }
      .wrap { max-width: 900px; margin: 2rem auto; padding: 1rem; }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 1.4rem;
        box-shadow: 0 16px 34px var(--shadow);
      }
      h1 { margin: 0 0 0.4rem; font-size: 1.7rem; }
      .sub { margin: 0 0 1rem; color: var(--muted); }
      .section-title { margin: 0 0 0.6rem; font-size: 1.05rem; font-weight: 700; }
      hr.divider { border: none; border-top: 1px solid var(--line); margin: 1.4rem 0; }

      .tabs { display: flex; gap: 0.5rem; margin: 0 0 1rem; }
      .tab-btn {
        flex: 1;
        border: 1px solid var(--line);
        background: var(--input-bg);
        color: var(--ink);
        border-radius: 999px;
        padding: 0.6rem 0.9rem;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.15s ease, box-shadow 0.15s ease;
      }
      .tab-btn.active {
        background: var(--chip-bg);
        border-color: var(--chip-border);
        color: var(--chip-ink);
      }

      label { font-size: 0.92rem; color: var(--muted); }
      .recipe-picker { display: block; margin: 0 0 0.9rem; }
      input, select, textarea {
        width: 100%; margin-top: 0.3rem; border: 1px solid var(--line);
        border-radius: 10px; padding: 0.55rem 0.65rem; font: inherit;
        background: var(--input-bg); color: var(--ink);
      }
      textarea { resize: vertical; min-height: 4.5rem; font-family: inherit; }
      input:focus, select:focus, textarea:focus, button:focus-visible {
        outline: 2px solid var(--accent); outline-offset: 1px;
      }

      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.85rem; }
      .grid .full { grid-column: 1 / -1; }

      .row { margin-top: 1rem; display: flex; gap: 0.6rem; flex-wrap: wrap; }
      button {
        border: 1px solid var(--line);
        background: var(--input-bg);
        color: var(--ink);
        border-radius: 10px;
        padding: 0.65rem 0.9rem;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        min-height: 2.7rem;
        transition: transform 0.06s ease, box-shadow 0.15s ease;
      }
      button:hover { box-shadow: 0 3px 10px var(--shadow); }
      button:active { transform: translateY(1px); }
      button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }
      .btn-main { background: var(--chip-bg); color: var(--chip-ink); border-color: var(--chip-border); }
      .btn-danger { background: var(--danger-bg); color: var(--danger-ink); border-color: var(--danger-border); }

      .status { margin-top: 0.7rem; min-height: 1.2rem; color: var(--ok); font-size: 0.92rem; }
      .status.error { color: var(--err); }

      .result {
        margin-top: 0.4rem; padding: 1rem 1.1rem; border: 1px solid var(--line);
        border-left: 4px solid var(--accent); border-radius: 14px; background: var(--panel-alt);
      }
      .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.6rem; margin-top: 0.7rem; }
      .tile { padding: 0.65rem; background: var(--input-bg); border: 1px solid var(--line); border-radius: 10px; }
      .k { margin: 0; color: var(--muted); font-size: 0.85rem; }
      .v { margin: 0.2rem 0 0; font-size: 1.1rem; font-weight: 700; }
      .badge {
        display: inline-block; padding: 0.2rem 0.5rem; border-radius: 999px;
        background: var(--chip-bg); color: var(--chip-ink); font-size: 0.8rem; margin-left: 0.35rem;
      }

      .instructions {
        background: var(--panel-alt); border: 1px solid var(--line);
        border-radius: 14px; padding: 1rem 1.1rem;
      }
      .instructions .steps { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.5rem; }
      .instructions .muted-note { margin: 0; color: var(--muted); font-size: 0.9rem; }

      .timer-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.85rem; }
      .timer { background: var(--panel-alt); border: 1px solid var(--line); border-radius: 14px; padding: 1rem; }
      .timer-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.4rem; }
      .timer-title { font-weight: 700; }
      .timer-meta { font-size: 0.8rem; color: var(--muted); font-weight: 400; }
      .timer-duration { display: flex; align-items: center; gap: 0.35rem; font-size: 0.85rem; color: var(--muted); }
      .timer-duration input { width: 4.5rem; margin: 0; padding: 0.35rem 0.4rem; }
      .timer-display {
        font-size: 2.1rem; font-weight: 700; text-align: center; margin: 0.5rem 0;
        letter-spacing: 0.03em; font-variant-numeric: tabular-nums;
      }
      .timer-bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; margin-bottom: 0.8rem; }
      .timer-bar-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.25s linear; }
      .timer-controls { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .timer-controls button { flex: 1; min-width: 4.5rem; }

      details.edit-panel {
        margin-top: 0.4rem; border: 1px solid var(--line); border-radius: 14px;
        padding: 0.2rem 1rem 1rem; background: var(--panel-alt);
      }
      details.edit-panel summary {
        cursor: pointer; padding: 0.9rem 0; font-weight: 700; list-style: none;
      }
      details.edit-panel summary::-webkit-details-marker { display: none; }
      details.edit-panel summary::before {
        content: "▸"; display: inline-block; margin-right: 0.5rem;
        transition: transform 0.15s ease; color: var(--accent);
      }
      details.edit-panel[open] summary::before { transform: rotate(90deg); }

      .wake-toggle {
        display: flex; align-items: center; gap: 0.45rem;
        font-size: 0.9rem; color: var(--muted); margin: 0 0 1rem;
      }
      .wake-toggle input { width: auto; margin: 0; }
      .version {
        font-size: 0.75rem; font-weight: 400; color: var(--muted);
        vertical-align: middle; margin-left: 0.4rem;
      }

      @media (max-width: 700px) {
        .grid, .timer-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section class="card">
        <h1>Anpassningsbar Degkalkylator <span class="version">v1.2</span></h1>
        <p class="sub">Kalkylator, instruktioner och timers för pizza, bröd och bakmaskin.</p>

        <label class="wake-toggle" id="wakeToggleWrap">
          <input type="checkbox" id="keepAwake" />
          Håll skärmen påslagen medan appen är öppen
        </label>
        <video
          id="nosleepVideo"
          muted
          playsinline
          loop
          style="position: fixed; width: 1px; height: 1px; opacity: 0.01; pointer-events: none;"
        >
          <source
            src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAMRbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAA+gAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAjt0cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAA+gAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAIAAAACAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAAPoAAAAAAABAAAAAAGzbWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAABAAAAAQABVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAABXm1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAAR5zdGJsAAAAunN0c2QAAAAAAAAAAQAAAKphdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAIAAgBIAAAASAAAAAAAAAABFUxhdmM2MC4zMS4xMDIgbGlieDI2NAAAAAAAAAAAAAAAGP//AAAAMGF2Y0MBQsAe/+EAGGdCwB7ZH4iIwEQAAAMABAAAAwAIPFi5IAEABWjLg8sgAAAAEHBhc3AAAAABAAAAAQAAABRidHJ0AAAAAAAAFDAAABQwAAAAGHN0dHMAAAAAAAAAAQAAAAEAAEAAAAAAHHN0c2MAAAAAAAAAAQAAAAEAAAABAAAAAQAAABRzdHN6AAAAAAAAAoYAAAABAAAAFHN0Y28AAAAAAAAAAQAAA0EAAABidWR0YQAAAFptZXRhAAAAAAAAACFoZGxyAAAAAAAAAABtZGlyYXBwbAAAAAAAAAAAAAAAAC1pbHN0AAAAJal0b28AAAAdZGF0YQAAAAEAAAAATGF2ZjYwLjE2LjEwMAAAAAhmcmVlAAACjm1kYXQAAAJwBgX//2zcRem95tlIt5Ys2CDZI+7veDI2NCAtIGNvcmUgMTY0IHIzMTA4IDMxZTE5ZjkgLSBILjI2NC9NUEVHLTQgQVZDIGNvZGVjIC0gQ29weWxlZnQgMjAwMy0yMDIzIC0gaHR0cDovL3d3dy52aWRlb2xhbi5vcmcveDI2NC5odG1sIC0gb3B0aW9uczogY2FiYWM9MCByZWY9MyBkZWJsb2NrPTE6MDowIGFuYWx5c2U9MHgxOjB4MTExIG1lPWhleCBzdWJtZT03IHBzeT0xIHBzeV9yZD0xLjAwOjAuMDAgbWl4ZWRfcmVmPTEgbWVfcmFuZ2U9MTYgY2hyb21hX21lPTEgdHJlbGxpcz0xIDh4OGRjdD0wIGNxbT0wIGRlYWR6b25lPTIxLDExIGZhc3RfcHNraXA9MSBjaHJvbWFfcXBfb2Zmc2V0PS0yIHRocmVhZHM9MSBsb29rYWhlYWRfdGhyZWFkcz0xIHNsaWNlZF90aHJlYWRzPTAgbnI9MCBkZWNpbWF0ZT0xIGludGVybGFjZWQ9MCBibHVyYXlfY29tcGF0PTAgY29uc3RyYWluZWRfaW50cmE9MCBiZnJhbWVzPTAgd2VpZ2h0cD0wIGtleWludD0yNTAga2V5aW50X21pbj0xIHNjZW5lY3V0PTQwIGludHJhX3JlZnJlc2g9MCByY19sb29rYWhlYWQ9NDAgcmM9Y3JmIG1idHJlZT0xIGNyZj0yMy4wIHFjb21wPTAuNjAgcXBtaW49MCBxcG1heD02OSBxcHN0ZXA9NCBpcF9yYXRpbz0xLjQwIGFxPTE6MS4wMACAAAAADmWIhAV///8PRQABQt+A"
            type="video/mp4"
          />
        </video>

        <div class="tabs">
          <button type="button" id="tabPizza" class="tab-btn active">Pizza</button>
          <button type="button" id="tabLoaf" class="tab-btn">Limpor</button>
          <button type="button" id="tabMachine" class="tab-btn">Bakmaskin</button>
        </div>

        <label class="recipe-picker">
          Receptförval
          <select id="recipeSelect"></select>
        </label>

        <div class="status" id="status" aria-live="polite"></div>

        <hr class="divider" />

        <h2 class="section-title">Resultat</h2>
        <div class="result" id="result"></div>

        <hr class="divider" />

        <h2 class="section-title">Instruktioner</h2>
        <div class="instructions" id="instructionsBox"></div>

        <hr class="divider" />

        <h2 class="section-title">Timers</h2>
        <div class="timer-grid">
          <div class="timer">
            <div class="timer-head">
              <span class="timer-title">Jäsning</span>
              <label class="timer-duration">
                <input id="proofDuration" type="number" min="0" step="5" value="0" />
                min
              </label>
            </div>
            <div class="timer-display" id="proofDisplay" aria-live="polite">00:00</div>
            <div class="timer-bar"><div class="timer-bar-fill" id="proofBarFill"></div></div>
            <div class="timer-controls">
              <button type="button" id="proofStart" class="btn-main">Starta</button>
              <button type="button" id="proofPause" disabled>Pausa</button>
              <button type="button" id="proofReset">Nollställ</button>
            </div>
          </div>

          <div class="timer">
            <div class="timer-head">
              <span class="timer-title">Gräddning <span class="timer-meta" id="bakeTempNote"></span></span>
              <label class="timer-duration">
                <input id="bakeDuration" type="number" min="0" step="1" value="0" />
                min
              </label>
            </div>
            <div class="timer-display" id="bakeDisplay" aria-live="polite">00:00</div>
            <div class="timer-bar"><div class="timer-bar-fill" id="bakeBarFill"></div></div>
            <div class="timer-controls">
              <button type="button" id="bakeStart" class="btn-main">Starta</button>
              <button type="button" id="bakePause" disabled>Pausa</button>
              <button type="button" id="bakeReset">Nollställ</button>
            </div>
          </div>
        </div>

        <details class="edit-panel" id="editPanel">
          <summary>Redigera recept</summary>

          <div class="grid">
            <label>
              Receptnamn
              <input id="recipeName" type="text" placeholder="t.ex. Helgpizza" />
            </label>

            <label>
              Kategori
              <select id="category" disabled>
                <option value="pizza">Pizza</option>
                <option value="loaf">Limpa</option>
                <option value="breadmachine">Bakmaskin</option>
              </select>
            </label>

            <label id="machineSizeWrap" style="display: none;">
              Bakmaskinsstorlek
              <select id="machineSize">
                <option value="500">500 g</option>
                <option value="1000" selected>1000 g</option>
                <option value="1500">1500 g</option>
              </select>
            </label>

            <label id="piecesWrap">
              <span id="piecesLabel">Antal delar</span>
              <input id="pieces" type="number" min="1" step="1" value="4" />
            </label>

            <label>
              Vikt per del (g)
              <input id="pieceWeight" type="number" min="1" step="1" value="260" />
            </label>

            <label>
              Hydrering (%)
              <input id="hydration" type="number" min="0" step="0.1" value="65" />
            </label>

            <label>
              Salt (%)
              <input id="salt" type="number" min="0" step="0.1" value="2.5" />
            </label>

            <label>
              Jäst (%)
              <input id="yeast" type="number" min="0" step="0.01" value="0.25" />
            </label>

            <label>
              Olja (%)
              <input id="oil" type="number" min="0" step="0.1" value="2" />
            </label>

            <label id="milkWrap">
              Mjölk (%)
              <input id="milk" type="number" min="0" step="0.1" value="0" />
            </label>

            <label id="butterWrap">
              Smör (%)
              <input id="butter" type="number" min="0" step="0.1" value="0" />
            </label>

            <label>
              Jästid (min)
              <input id="proofMinutes" type="number" min="0" step="5" value="0" />
            </label>

            <label>
              Gräddningstid (min)
              <input id="bakeMinutes" type="number" min="0" step="1" value="0" />
            </label>

            <label>
              Gräddningstemp (°C)
              <input id="bakeTemp" type="number" min="0" step="5" value="0" />
            </label>

            <label class="full">
              Instruktioner (en rad per steg)
              <textarea id="instructions" placeholder="T.ex.&#10;Blanda alla ingredienser.&#10;Knåda i 10 minuter.&#10;..."></textarea>
            </label>
          </div>

          <div class="row">
            <button id="newRecipe">Ny tom</button>
            <button id="saveNew" class="btn-main">Spara som nytt recept</button>
            <button id="updateRecipe">Uppdatera valt recept</button>
            <button id="deleteRecipe" class="btn-danger">Ta bort valt recept</button>
          </div>
        </details>
      </section>
    </div>

    <script>
      const ids = [
        'recipeSelect', 'recipeName', 'category', 'pieces', 'pieceWeight', 'hydration',
        'salt', 'yeast', 'oil', 'milk', 'butter', 'proofMinutes', 'bakeMinutes', 'bakeTemp', 'instructions',
      ];
      const el = Object.fromEntries(ids.map((id) => [id, document.getElementById(id)]));
      const result = document.getElementById('result');
      const status = document.getElementById('status');
      const instructionsBox = document.getElementById('instructionsBox');
      const bakeTempNote = document.getElementById('bakeTempNote');
      const editPanel = document.getElementById('editPanel');
      const saveNewBtn = document.getElementById('saveNew');
      const updateBtn = document.getElementById('updateRecipe');
      const deleteBtn = document.getElementById('deleteRecipe');
      const newBtn = document.getElementById('newRecipe');
      const tabPizza = document.getElementById('tabPizza');
      const tabLoaf = document.getElementById('tabLoaf');
      const tabMachine = document.getElementById('tabMachine');
      const machineSizeWrap = document.getElementById('machineSizeWrap');
      const machineSize = document.getElementById('machineSize');
      const piecesWrap = document.getElementById('piecesWrap');
      const piecesLabel = document.getElementById('piecesLabel');
      const milkWrap = document.getElementById('milkWrap');
      const butterWrap = document.getElementById('butterWrap');

      let recipes = [];
      const categoryLabels = { pizza: 'Pizza', loaf: 'Limpa', breadmachine: 'Bakmaskin' };
      let activeCategory = 'pizza';

      function grams(n) {
        return `${Math.round(n)} g`;
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
        }[c]));
      }

      function showStatus(msg, isError = false) {
        status.textContent = msg;
        status.classList.toggle('error', isError);
      }

      const pizzaInstructions = [
        'Blanda mjöl, vatten, salt och jäst till en smidig deg.',
        'Knåda degen i cirka 10 minuter tills den är elastisk.',
        'Låt degen jäsa övertäckt tills den dubblat i storlek.',
        'Dela degen i bollar och forma. Låt jäsa en kort stund till.',
        'Kavla eller töj ut till bottnar och klä med topping.',
        'Grädda i het ugn tills kanten är gyllenbrun.',
      ].join('\n');

      const loafInstructions = [
        'Blanda mjöl, vatten, salt och jäst till en deg.',
        'Knåda degen väl och låt den jäsa övertäckt till dubbel storlek.',
        'Forma limpor och lägg i formar eller på plåt.',
        'Låt jäsa en andra gång tills degen känns lätt och luftig.',
        'Grädda tills brödet låter ihåligt när du knackar på undersidan.',
        'Låt svalna på galler innan du skär i brödet.',
      ].join('\n');

      const machineInstructions = [
        'Häll i vätska, olja/smör och mjölk enligt receptet.',
        'Tillsätt mjöl så det täcker vätskan helt.',
        'Lägg salt i ett hörn och jäst i ett annat, utan direktkontakt.',
        'Välj program och storlek på bakmaskinen och starta.',
      ].join('\n');

      function defaultRecipeForCategory(category, forcedWeight) {
        if (category === 'pizza') {
          return {
            name: '', category, pieces: 4, pieceWeight: 250, hydration: 65, salt: 2.5, yeast: 0.25,
            oil: 2, milk: 0, butter: 0, proofMinutes: 90, bakeMinutes: 8, bakeTemp: 250,
            instructions: pizzaInstructions,
          };
        }
        if (category === 'loaf') {
          return {
            name: '', category, pieces: 2, pieceWeight: 700, hydration: 70, salt: 2.5, yeast: 1,
            oil: 2, milk: 0, butter: 0, proofMinutes: 120, bakeMinutes: 35, bakeTemp: 225,
            instructions: loafInstructions,
          };
        }
        const bw = Number(forcedWeight || machineSize.value || 1000);
        return {
          name: '', category, pieces: 1, pieceWeight: bw, hydration: 62, salt: 1.8, yeast: 1.2,
          oil: 2, milk: 0, butter: 0, proofMinutes: 0, bakeMinutes: 0, bakeTemp: 0,
          instructions: machineInstructions,
        };
      }

      function recipeFromInputs() {
        return {
          name: el.recipeName.value.trim(),
          category: el.category.value,
          pieces: Number(el.pieces.value),
          pieceWeight: Number(el.pieceWeight.value),
          hydration: Number(el.hydration.value),
          salt: Number(el.salt.value),
          yeast: Number(el.yeast.value),
          oil: Number(el.oil.value),
          milk: Number(el.milk.value),
          butter: Number(el.butter.value),
          proofMinutes: Number(el.proofMinutes.value) || 0,
          bakeMinutes: Number(el.bakeMinutes.value) || 0,
          bakeTemp: Number(el.bakeTemp.value) || 0,
          instructions: el.instructions.value,
        };
      }

      function renderInstructions(text) {
        const lines = String(text || '').split('\n').map((l) => l.trim()).filter(Boolean);
        if (lines.length === 0) {
          instructionsBox.innerHTML = '<p class="muted-note">Inga instruktioner angivna för detta recept.</p>';
          return;
        }
        instructionsBox.innerHTML = `<ol class="steps">${lines.map((l) => `<li>${escapeHtml(l)}</li>`).join('')}</ol>`;
      }

      function applyRecipe(recipe) {
        el.recipeName.value = recipe.name;
        el.category.value = recipe.category;
        el.pieces.value = recipe.pieces;
        el.pieceWeight.value = recipe.pieceWeight;
        el.hydration.value = recipe.hydration;
        el.salt.value = recipe.salt;
        el.yeast.value = recipe.yeast;
        el.oil.value = recipe.oil;
        el.milk.value = recipe.milk || 0;
        el.butter.value = recipe.butter || 0;
        el.proofMinutes.value = recipe.proofMinutes || 0;
        el.bakeMinutes.value = recipe.bakeMinutes || 0;
        el.bakeTemp.value = recipe.bakeTemp || 0;
        el.instructions.value = recipe.instructions || '';
        if (recipe.category === 'breadmachine' && ['500', '1000', '1500'].includes(String(recipe.pieceWeight))) {
          machineSize.value = String(recipe.pieceWeight);
        }
        renderInstructions(recipe.instructions);
        bakeTempNote.textContent = recipe.bakeTemp ? `(${recipe.bakeTemp}°C)` : '';
        proofTimer.setDefaultMinutes(recipe.proofMinutes || 0);
        bakeTimer.setDefaultMinutes(recipe.bakeMinutes || 0);
        calculate();
      }

      function filteredRecipes() {
        return recipes.filter((r) => r.category === activeCategory);
      }

      function setActiveCategory(category) {
        activeCategory = category;
        el.category.value = category;
        tabPizza.classList.toggle('active', category === 'pizza');
        tabLoaf.classList.toggle('active', category === 'loaf');
        tabMachine.classList.toggle('active', category === 'breadmachine');
        machineSizeWrap.style.display = category === 'breadmachine' ? 'block' : 'none';
        piecesWrap.style.display = category === 'breadmachine' ? 'none' : 'block';
        milkWrap.style.display = category === 'pizza' ? 'none' : 'block';
        butterWrap.style.display = category === 'pizza' ? 'none' : 'block';
        if (category === 'pizza') {
          piecesLabel.textContent = 'Antal degbollar';
        } else if (category === 'loaf') {
          piecesLabel.textContent = 'Antal limpor';
        } else {
          piecesLabel.textContent = 'Antal delar';
        }
        if (category === 'breadmachine') {
          el.pieces.value = 1;
        }
      }

      function renderRecipeSelect(selectedId) {
        const tabRecipes = filteredRecipes();
        el.recipeSelect.innerHTML = tabRecipes
          .map((r) => `<option value="${r.id}">${escapeHtml(r.name)} (${categoryLabels[r.category] || r.category})</option>`)
          .join('');

        if (tabRecipes.length === 0) {
          el.recipeSelect.innerHTML = '<option value="">Inga recept ännu</option>';
          applyRecipe(defaultRecipeForCategory(activeCategory));
          return;
        }

        const targetId = selectedId || tabRecipes[0].id;
        el.recipeSelect.value = targetId;
        const selected = tabRecipes.find((r) => r.id === targetId) || tabRecipes[0];
        applyRecipe(selected);
      }

      async function loadRecipes(selectedId) {
        const res = await fetch('/api/recipes');
        if (!res.ok) {
          throw new Error('Kunde inte ladda recept');
        }
        recipes = await res.json();
        renderRecipeSelect(selectedId);
      }

      function calculate() {
        const pieces = activeCategory === 'breadmachine' ? 1 : Number(el.pieces.value);
        const pieceWeight = Number(el.pieceWeight.value);
        const hydration = Number(el.hydration.value) / 100;
        const salt = Number(el.salt.value) / 100;
        const yeast = Number(el.yeast.value) / 100;
        const oil = Number(el.oil.value) / 100;
        const usesMilkButter = activeCategory !== 'pizza';
        const milk = usesMilkButter ? Number(el.milk.value) / 100 : 0;
        const butter = usesMilkButter ? Number(el.butter.value) / 100 : 0;

        const totalDough = pieces * pieceWeight;
        const factor = 1 + hydration + salt + yeast + oil + milk + butter;
        const flour = totalDough / factor;
        const water = flour * hydration;
        const saltG = flour * salt;
        const yeastG = flour * yeast;
        const oilG = flour * oil;
        const milkG = flour * milk;
        const butterG = flour * butter;

        result.innerHTML = `
          <div>
            Total deg: <strong>${grams(totalDough)}</strong>
            <span class="badge">${categoryLabels[el.category.value] || el.category.value}recept</span>
          </div>
          <div class="result-grid">
            <div class="tile"><p class="k">Mjöl</p><p class="v">${grams(flour)}</p></div>
            <div class="tile"><p class="k">Vatten</p><p class="v">${grams(water)}</p></div>
            <div class="tile"><p class="k">Salt</p><p class="v">${grams(saltG)}</p></div>
            <div class="tile"><p class="k">Jäst</p><p class="v">${grams(yeastG)}</p></div>
            <div class="tile"><p class="k">Olja</p><p class="v">${grams(oilG)}</p></div>
            ${usesMilkButter ? `<div class="tile"><p class="k">Mjölk</p><p class="v">${grams(milkG)}</p></div>` : ''}
            ${usesMilkButter ? `<div class="tile"><p class="k">Smör</p><p class="v">${grams(butterG)}</p></div>` : ''}
            <div class="tile"><p class="k">Per del</p><p class="v">${grams(pieceWeight)}</p></div>
          </div>
        `;
      }

      el.recipeSelect.addEventListener('change', () => {
        const selected = filteredRecipes().find((r) => r.id === el.recipeSelect.value);
        if (selected) {
          applyRecipe(selected);
          showStatus(`Laddade recept: ${selected.name}`);
        }
      });

      ['recipeName', 'pieces', 'pieceWeight', 'hydration', 'salt', 'yeast', 'oil', 'milk', 'butter']
        .forEach((id) => el[id].addEventListener('input', calculate));

      el.instructions.addEventListener('input', () => renderInstructions(el.instructions.value));

      tabPizza.addEventListener('click', () => {
        setActiveCategory('pizza');
        renderRecipeSelect();
        showStatus('Flik: Pizza');
      });

      tabLoaf.addEventListener('click', () => {
        setActiveCategory('loaf');
        renderRecipeSelect();
        showStatus('Flik: Limpor');
      });

      tabMachine.addEventListener('click', () => {
        setActiveCategory('breadmachine');
        renderRecipeSelect();
        showStatus('Flik: Bakmaskin');
      });

      machineSize.addEventListener('change', () => {
        if (activeCategory !== 'breadmachine') {
          return;
        }
        el.pieces.value = 1;
        el.pieceWeight.value = Number(machineSize.value);
        calculate();
        showStatus(`Bakmaskin: ${machineSize.value} g`);
      });

      newBtn.addEventListener('click', () => {
        el.recipeSelect.value = '';
        applyRecipe(defaultRecipeForCategory(activeCategory));
        editPanel.open = true;
        showStatus('Nytt tomt recept klart. Ange namn och spara.');
      });

      saveNewBtn.addEventListener('click', async () => {
        try {
          const payload = recipeFromInputs();
          const res = await fetch('/api/recipes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.error || 'Kunde inte spara recept');
          }
          await loadRecipes(data.id);
          showStatus(`Sparade nytt recept: ${data.name}`);
        } catch (err) {
          showStatus(err.message, true);
        }
      });

      updateBtn.addEventListener('click', async () => {
        try {
          const id = el.recipeSelect.value;
          if (!id) {
            throw new Error('Välj ett recept först för att uppdatera');
          }
          const payload = recipeFromInputs();
          const res = await fetch(`/api/recipes/${encodeURIComponent(id)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.error || 'Kunde inte uppdatera recept');
          }
          await loadRecipes(data.id);
          showStatus(`Uppdaterade recept: ${data.name}`);
        } catch (err) {
          showStatus(err.message, true);
        }
      });

      deleteBtn.addEventListener('click', async () => {
        try {
          const id = el.recipeSelect.value;
          if (!id) {
            throw new Error('Välj ett recept först för att ta bort');
          }

          const selected = recipes.find((r) => r.id === id);
          const recipeName = selected ? selected.name : 'detta recept';
          if (!window.confirm(`Ta bort recept \"${recipeName}\"?`)) {
            return;
          }

          const res = await fetch(`/api/recipes/${encodeURIComponent(id)}`, {
            method: 'DELETE',
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.error || 'Kunde inte ta bort recept');
          }

          await loadRecipes();
          showStatus(`Tog bort recept: ${data.deleted.name}`);
        } catch (err) {
          showStatus(err.message, true);
        }
      });

      const keepAwakeCheckbox = document.getElementById('keepAwake');
      const nosleepVideo = document.getElementById('nosleepVideo');
      const wakeLockSupported = 'wakeLock' in navigator;
      let wakeLock = null;
      let usingVideoFallback = false;

      async function requestWakeLock() {
        if (!wakeLockSupported) {
          return false;
        }
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => {
            wakeLock = null;
          });
          return true;
        } catch {
          return false;
        }
      }

      function releaseWakeLock() {
        if (wakeLock) {
          wakeLock.release();
          wakeLock = null;
        }
      }

      async function startVideoFallback() {
        try {
          await nosleepVideo.play();
          usingVideoFallback = true;
          return true;
        } catch {
          return false;
        }
      }

      function stopVideoFallback() {
        if (usingVideoFallback) {
          nosleepVideo.pause();
          usingVideoFallback = false;
        }
      }

      // Some browsers (e.g. Firefox/Chrome on iOS) don't expose the Wake
      // Lock API at all because iOS restricts it to Safari's engine, even
      // though those browsers also run on WebKit. A silent looping video
      // keeps the screen on in that case too.
      async function enableKeepAwake() {
        if (await requestWakeLock()) {
          return true;
        }
        return startVideoFallback();
      }

      function disableKeepAwake() {
        releaseWakeLock();
        stopVideoFallback();
      }

      function getWakeAwakePref() {
        try {
          return localStorage.getItem('keepAwake') === '1';
        } catch {
          return false;
        }
      }

      function setWakeAwakePref(value) {
        try {
          localStorage.setItem('keepAwake', value ? '1' : '0');
        } catch {
          // ignore (private browsing / storage disabled)
        }
      }

      keepAwakeCheckbox.addEventListener('change', async () => {
        if (keepAwakeCheckbox.checked) {
          const ok = await enableKeepAwake();
          if (ok) {
            setWakeAwakePref(true);
            showStatus('Skärmen hålls nu påslagen.');
          } else {
            keepAwakeCheckbox.checked = false;
            setWakeAwakePref(false);
            showStatus('Kunde inte hålla skärmen påslagen i denna webbläsare.', true);
          }
        } else {
          disableKeepAwake();
          setWakeAwakePref(false);
          showStatus('Skärmen kan nu stängas av automatiskt igen.');
        }
      });

      document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState === 'visible' && keepAwakeCheckbox.checked && !wakeLock && !usingVideoFallback) {
          await enableKeepAwake();
        }
      });

      // --- Timers -------------------------------------------------------
      // Proofing and baking timers per recipe. While either timer runs, the
      // screen is kept awake automatically (reusing the same mechanism as
      // the manual toggle above) even if the checkbox itself isn't checked,
      // and released again once both timers are idle.

      let audioCtx = null;
      function ensureAudioCtx() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) {
            audioCtx = new Ctx();
          }
        }
        return audioCtx;
      }

      function playAlarm() {
        const ctx = ensureAudioCtx();
        if (ctx) {
          if (ctx.state === 'suspended') {
            ctx.resume().catch(() => {});
          }
          let t = ctx.currentTime;
          for (let i = 0; i < 3; i++) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
            osc.connect(gain).connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.34);
            t += 0.45;
          }
        }
        if (navigator.vibrate) {
          navigator.vibrate([200, 100, 200, 100, 200]);
        }
      }

      let activeTimerCount = 0;
      let timerKeepAwakeActive = false;

      async function onTimerStart() {
        activeTimerCount += 1;
        if (activeTimerCount === 1 && !wakeLock && !usingVideoFallback) {
          timerKeepAwakeActive = await enableKeepAwake();
        }
      }

      function onTimerStop() {
        activeTimerCount = Math.max(0, activeTimerCount - 1);
        if (activeTimerCount === 0 && timerKeepAwakeActive && !keepAwakeCheckbox.checked) {
          disableKeepAwake();
          timerKeepAwakeActive = false;
        }
      }

      function formatTime(ms) {
        const totalSec = Math.max(0, Math.round(ms / 1000));
        const m = Math.floor(totalSec / 60);
        const s = totalSec % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      function createTimer({ durationInput, display, bar, startBtn, pauseBtn, resetBtn, label }) {
        let totalMs = 0;
        let remainingMs = 0;
        let endAt = null;
        let intervalId = null;
        let running = false;
        let dirty = false;

        function render() {
          display.textContent = formatTime(remainingMs);
          const pct = totalMs > 0 ? Math.min(100, Math.max(0, 100 - (remainingMs / totalMs) * 100)) : 0;
          bar.style.width = `${pct}%`;
        }

        function stopInterval() {
          if (intervalId) {
            clearInterval(intervalId);
            intervalId = null;
          }
        }

        function finish() {
          stopInterval();
          running = false;
          startBtn.disabled = false;
          pauseBtn.disabled = true;
          render();
          showStatus(`${label}: klar!`);
          playAlarm();
          onTimerStop();
        }

        function tick() {
          remainingMs = Math.max(0, endAt - Date.now());
          render();
          if (remainingMs <= 0) {
            finish();
          }
        }

        function start() {
          const minutes = Number(durationInput.value) || 0;
          if (!running && (remainingMs <= 0 || totalMs !== minutes * 60000)) {
            totalMs = Math.max(0, minutes) * 60000;
            remainingMs = totalMs;
          }
          if (remainingMs <= 0) {
            showStatus(`Ange en tid för ${label.toLowerCase()} först.`, true);
            return;
          }
          ensureAudioCtx();
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
          }
          endAt = Date.now() + remainingMs;
          running = true;
          dirty = true;
          durationInput.disabled = true;
          startBtn.disabled = true;
          pauseBtn.disabled = false;
          stopInterval();
          intervalId = setInterval(tick, 250);
          render();
          onTimerStart();
        }

        function pause() {
          if (!running) {
            return;
          }
          running = false;
          remainingMs = Math.max(0, endAt - Date.now());
          stopInterval();
          durationInput.disabled = false;
          startBtn.disabled = false;
          pauseBtn.disabled = true;
          render();
          onTimerStop();
        }

        function reset() {
          const wasRunning = running;
          stopInterval();
          running = false;
          dirty = false;
          const minutes = Number(durationInput.value) || 0;
          totalMs = Math.max(0, minutes) * 60000;
          remainingMs = totalMs;
          durationInput.disabled = false;
          startBtn.disabled = false;
          pauseBtn.disabled = true;
          render();
          if (wasRunning) {
            onTimerStop();
          }
        }

        function setDefaultMinutes(minutes) {
          if (running || dirty) {
            return;
          }
          durationInput.value = minutes;
          totalMs = Math.max(0, minutes) * 60000;
          remainingMs = totalMs;
          render();
        }

        startBtn.addEventListener('click', start);
        pauseBtn.addEventListener('click', pause);
        resetBtn.addEventListener('click', reset);

        render();

        return { setDefaultMinutes };
      }

      const proofTimer = createTimer({
        durationInput: document.getElementById('proofDuration'),
        display: document.getElementById('proofDisplay'),
        bar: document.getElementById('proofBarFill'),
        startBtn: document.getElementById('proofStart'),
        pauseBtn: document.getElementById('proofPause'),
        resetBtn: document.getElementById('proofReset'),
        label: 'Jäsning',
      });

      const bakeTimer = createTimer({
        durationInput: document.getElementById('bakeDuration'),
        display: document.getElementById('bakeDisplay'),
        bar: document.getElementById('bakeBarFill'),
        startBtn: document.getElementById('bakeStart'),
        pauseBtn: document.getElementById('bakePause'),
        resetBtn: document.getElementById('bakeReset'),
        label: 'Gräddning',
      });

      (async () => {
        try {
          setActiveCategory('pizza');
          await loadRecipes();
          showStatus('Recept laddade från databasen.');
        } catch (err) {
          showStatus(err.message, true);
        }

        if (getWakeAwakePref()) {
          keepAwakeCheckbox.checked = true;
          await enableKeepAwake();
        }
      })();
    </script>
  </body>
</html>
